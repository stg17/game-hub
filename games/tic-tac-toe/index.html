<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe — Game Hub</title>
<link rel="stylesheet" href="type.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a href="../../index.html" class="hub-link">
  <svg class="hub-link__arrow" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M10 2 4 8l6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"/></svg>
  Back to the box
</a>

<main class="wrap">
  <header class="head">
    <p class="head__no">No.&nbsp;06</p>
    <h1>Tic&nbsp;Tac&nbsp;Toe</h1>
    <p class="head__rule" id="headRule">Three in a row wins. Whoever starts alternates each round.</p>
  </header>

  <!-- Who you are playing. Above the scoreboard because it changes what the
       scoreboard is counting. -->
  <div class="modes" role="group" aria-label="Opponent">
    <button class="mode-btn is-on" type="button" id="modeTwo" aria-pressed="true">2 players</button>
    <button class="mode-btn" type="button" id="modeCpu" aria-pressed="false">Computer</button>
  </div>

  <div class="scoreboard">
    <div class="score-card" data-player="X" id="scoreX">
      <span class="lamp" aria-hidden="true"></span>
      <span class="mark mark-x">X</span>
      <span class="score-value" id="scoreXValue">0</span>
      <span class="score-label" id="scoreXLabel">wins</span>
    </div>
    <div class="score-card draws" id="scoreDraws">
      <span class="mark mark-draw">&ndash;</span>
      <span class="score-value" id="scoreDrawValue">0</span>
      <span class="score-label">draws</span>
    </div>
    <div class="score-card" data-player="O" id="scoreO">
      <span class="lamp" aria-hidden="true"></span>
      <span class="mark mark-o">O</span>
      <span class="score-value" id="scoreOValue">0</span>
      <span class="score-label" id="scoreOLabel">wins</span>
    </div>
  </div>

  <p class="status" id="status" role="status" aria-live="polite">X's turn</p>

  <div class="board" id="board">
    <button class="cell" data-index="0"></button>
    <button class="cell" data-index="1"></button>
    <button class="cell" data-index="2"></button>
    <button class="cell" data-index="3"></button>
    <button class="cell" data-index="4"></button>
    <button class="cell" data-index="5"></button>
    <button class="cell" data-index="6"></button>
    <button class="cell" data-index="7"></button>
    <button class="cell" data-index="8"></button>
    <svg class="win-line" id="winLine" viewBox="0 0 300 300" preserveAspectRatio="none" aria-hidden="true" focusable="false">
      <line id="winLineEl" x1="0" y1="0" x2="0" y2="0" />
    </svg>
  </div>

  <div class="controls">
    <button class="btn btn-primary" id="newRoundBtn">Clear the board</button>
    <button class="btn btn-ghost" id="resetScoresBtn">Reset the score</button>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nonograms — Game Hub</title>
<link rel="stylesheet" href="type.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a href="../../index.html" class="hub-link">
  <svg class="hub-link__arrow" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M10 2 4 8l6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"/></svg>
  Back to the box
</a>

<main class="wrap">
  <header class="head">
    <p class="head__no">No.&nbsp;07</p>
    <h1>Nonograms</h1>
    <p class="head__rule">The numbers say how much ink each line carries. Work out the picture.</p>
  </header>

  <!-- ── the index of plates ──────────────────────────────────────────── -->
  <section id="screen-index" class="screen">

    <div class="resume" id="resume" hidden>
      <p class="badge">On the press</p>
      <p class="resume__what" id="resumeWhat"></p>
      <div class="btn-row">
        <button class="btn btn-primary" type="button" id="resumeBtn">Carry on</button>
        <button class="btn btn-ghost" type="button" id="discardBtn">Put it back</button>
      </div>
    </div>

    <div class="tabs" id="sizeTabs" role="tablist" aria-label="Plate size">
      <button class="tab" type="button" role="tab" id="tab-small"  data-size="small"  aria-controls="plates" aria-selected="true"  tabindex="0">Small</button>
      <button class="tab" type="button" role="tab" id="tab-medium" data-size="medium" aria-controls="plates" aria-selected="false" tabindex="-1">Medium</button>
      <button class="tab" type="button" role="tab" id="tab-large"  data-size="large"  aria-controls="plates" aria-selected="false" tabindex="-1">Large</button>
    </div>

    <p class="spec-line" id="indexSpec"></p>

    <div class="plates" id="plates" role="tabpanel" aria-labelledby="tab-small" tabindex="-1"></div>
  </section>

  <!-- ── the plate ────────────────────────────────────────────────────── -->
  <section id="screen-play" class="screen" hidden>
    <p class="spec-line" id="playNo"></p>

    <div class="play">
      <div class="press">
        <div class="board" id="board"></div>
      </div>

      <aside class="apparatus">
        <div class="slip">
          <span class="slip__label">Clock</span>
          <span class="slip__value" id="clock">0:00</span>
        </div>

        <div class="key" id="playKey">
          <span class="slip__label">Marks</span>
          <ul class="key__list key__list--marks">
            <li><i class="key__sq key__sq--ink" aria-hidden="true"></i>Inked</li>
            <li><i class="key__sq key__sq--out" aria-hidden="true"></i>Blank</li>
            <li><i class="key__sq" aria-hidden="true"></i>Open</li>
          </ul>
          <ul class="key__list key__list--keys">
            <li><kbd>Arrows</kbd>Move</li>
            <li><kbd>Space</kbd>Ink</li>
            <li><kbd>X</kbd>Blank</li>
            <li><kbd>H</kbd>Hint</li>
            <li><kbd>Esc</kbd>Menu</li>
          </ul>
        </div>

        <div class="finish" id="finish" hidden>
          <span class="slip__label">Plate finished</span>
          <h2 class="finish__name" id="doneName">&nbsp;</h2>
          <p class="finish__stats" id="doneStats"></p>
          <div class="btn-row btn-row--stack">
            <button class="btn btn-primary" type="button" id="nextBtn">Next plate</button>
            <button class="btn btn-ghost"   type="button" id="doneIndexBtn">Menu</button>
          </div>
        </div>
      </aside>
    </div>

    <p class="note" id="hintLine" role="status" aria-live="polite"></p>

    <div class="btn-row" id="playActions">
      <button class="btn btn-ghost" type="button" id="hintBtn">Hint</button>
      <button class="btn btn-ghost" type="button" id="restartBtn">Reset</button>
      <button class="btn btn-ghost" type="button" id="playBackBtn">Menu</button>
    </div>
  </section>
</main>

<script src="nonogram.js"></script>
<script src="pictures.js"></script>
<script src="storage.js"></script>
<script src="game.js"></script>
</body>
</html>
